[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "alpha"
version = "0.1.0"
description = "Real-time trading simulation engine for evaluating algorithmic strategies under stochastic price models."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Alpha" }]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "streamlit>=1.39",
    "plotly>=5.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "scipy>=1.11",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
